# The Proxmox host mirrors the Cambrionix hub's serial node into /dev/ct-serial
# (bind-mounted directory, so replugs show up live). pyserial only enumerates
# /dev/ttyUSB*, and matches sysfs by that name, so expose same-named symlinks.
# Links for absent devices dangle and are ignored by the app.
L /dev/ttyUSB0 - - - - ct-serial/ttyUSB0
L /dev/ttyUSB1 - - - - ct-serial/ttyUSB1
L /dev/ttyUSB2 - - - - ct-serial/ttyUSB2
L /dev/ttyUSB3 - - - - ct-serial/ttyUSB3
L /dev/ttyUSB4 - - - - ct-serial/ttyUSB4
L /dev/ttyUSB5 - - - - ct-serial/ttyUSB5
L /dev/ttyUSB6 - - - - ct-serial/ttyUSB6
L /dev/ttyUSB7 - - - - ct-serial/ttyUSB7
